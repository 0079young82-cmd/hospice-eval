<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>교수용 결과 확인 · 호스피스간호실무</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.wide{max-width:1100px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600}
.tab[aria-selected="true"]{background:var(--dusk);color:#fff;border-color:var(--dusk)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;width:100%}
.stat b{display:block;font-family:"Gowun Batang",serif;font-size:17px}
.stat .big{font-size:30px;font-family:"Gowun Batang",serif;line-height:1.2;margin:6px 0 2px}
.stat span{font-size:14px;color:var(--muted)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;min-width:120px}
.bar i{display:block;height:100%;background:var(--lamp)}
.bar i.low{background:var(--no)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.tools input,.tools select{width:auto;flex:1;min-width:160px}
.qa td.q{white-space:normal;min-width:280px}
.miss{color:var(--muted)}
main.wrap{margin-top:0;padding-top:8px}
select{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--choice);color:var(--ink)}
</style>
</head>
<body>
<header class="sky"><div class="wrap wide">
<p class="course" id="courseLbl"></p>
<h1>교수용 결과 확인</h1>
<p class="lead">학생들이 제출한 진단평가와 주차별 형성평가 결과를 한곳에서 봅니다.</p>
</div></header>
<main class="wrap wide" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="questions.js"></script>
<script>
const app=document.getElementById("app");
document.getElementById("courseLbl").textContent=COURSE_LABEL;
let ROWS=[], VIEW="summary", SEL="dx", SORT={k:"sid",d:1}, Q="";
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800)}
function fmt(iso){const d=new Date(iso);if(isNaN(d))return iso;return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`}
// 서버 점수 대신 문항은행으로 다시 채점
function regrade(r){const b=BANK[r.key];if(!b)return r;const a=String(r.answers);let s=0;b.items.forEach((q,i)=>{if(+a[i]-1===q.a)s++});return {...r,score:s,total:b.items.length}}
function latest(key){const m={};ROWS.filter(r=>r.key===key).forEach(r=>{const k=r.sid;if(!m[k]){m[k]={...r,tries:1}}else{m[k].tries++;if(r.at>m[k].at)m[k]={...r,tries:m[k].tries}}});return Object.values(m)}
function login(msg){
  app.innerHTML=`<section class="card" style="max-width:460px">
  <label for="pw">관리자 비밀번호</label><input id="pw" type="password" autocomplete="current-password">
  <div class="err" id="err">${msg||""}</div>
  <div class="row" style="justify-content:flex-start"><button class="btn primary" id="go">결과 불러오기</button></div>
  ${API_URL?"":'<p class="note">config.js에 API_URL이 비어 있어요. README의 순서대로 서버 주소를 먼저 넣어 주세요.</p>'}</section>`;
  const go=()=>load(document.getElementById("pw").value);
  document.getElementById("go").onclick=go;document.getElementById("pw").onkeydown=e=>{if(e.key==="Enter")go()};
  document.getElementById("pw").focus();
}
async function load(pw){
  if(!pw){login("비밀번호를 입력해 주세요.");return}
  app.innerHTML=`<section class="card">결과를 불러오는 중이에요…</section>`;
  try{const r=await fetch(API_URL,{method:"POST",body:JSON.stringify({action:"results",password:pw})});const j=await r.json();
    if(!j.ok){login(j.error==="auth"?"비밀번호가 맞지 않아요.":"불러오지 못했어요: "+j.error);return}
    ROWS=j.rows.map(regrade);sessionStorage.setItem("hp_pw",pw);render()}
  catch(e){login("서버에 연결하지 못했어요. API_URL과 배포 설정(액세스: 모든 사용자)을 확인해 주세요.")}
}
function tabs(){return `<div class="tabs" role="tablist">
 ${[["summary","전체 현황"],["one","평가별 결과"],["items","문항 분석"],["students","학생별 성적표"]].map(([k,l])=>`<button class="tab" role="tab" aria-selected="${VIEW===k}" data-v="${k}">${l}</button>`).join("")}
 <span style="flex:1"></span><button class="btn" id="reload">새로고침</button><button class="btn" id="csv">CSV 내려받기</button></div>`}
function sel(){return `<select id="sel">${ORDER.map(k=>`<option value="${k}" ${k===SEL?"selected":""}>${WEEK[k]} · ${esc(BANK[k].title)}</option>`).join("")}</select>`}
function render(){
  let h=tabs();
  const students=[...new Map(ROWS.map(r=>[r.sid,r.name])).entries()];
  if(VIEW==="summary"){
    h+=`<p class="note">응답자 ${students.length}명 · 제출 ${ROWS.length}건. 카드를 누르면 해당 평가 결과로 이동합니다.</p><div class="grid">`+ORDER.map(k=>{
      const L=latest(k);const avg=L.length?(L.reduce((s,r)=>s+r.score/r.total,0)/L.length*100):null;
      return `<button class="stat" data-k="${k}"><span>${WEEK[k]}</span><b>${esc(BANK[k].title)}</b><div class="big">${L.length}명</div><span>${avg===null?"아직 제출 없음":"평균 "+avg.toFixed(0)+"점 (100점 환산)"}</span></button>`}).join("")+`</div>`;
  }
  if(VIEW==="one"){
    let L=latest(SEL).filter(r=>!Q||r.sid.includes(Q)||r.name.includes(Q));
    L.sort((a,b)=>{const x=a[SORT.k],y=b[SORT.k];return (x>y?1:x<y?-1:0)*SORT.d});
    const n=BANK[SEL].items.length;
    h+=`<div class="tools">${sel()}<input id="q" placeholder="학번 또는 이름 검색" value="${esc(Q)}"></div>
    <p class="note">학생별 가장 최근 제출을 보여 줍니다. 제목을 누르면 정렬돼요.</p>
    <div class="tbl"><table><tr><th data-s="sid">학번</th><th data-s="name">이름</th><th data-s="score">점수</th><th data-s="tries">응시 횟수</th><th data-s="at">최근 제출</th><th>오답 문항</th></tr>
    ${L.map(r=>`<tr><td>${esc(r.sid)}</td><td>${esc(r.name)}</td><td><b>${r.score}</b> / ${n}</td><td>${r.tries}</td><td>${fmt(r.at)}</td><td>${esc(r.wrong)||"없음"}</td></tr>`).join("")||`<tr><td colspan="6" class="miss">아직 제출한 학생이 없어요.</td></tr>`}</table></div>`;
  }
  if(VIEW==="items"){
    const L=latest(SEL), b=BANK[SEL];
    h+=`<div class="tools">${sel()}</div><p class="note">${L.length}명 기준 문항별 정답률입니다. 50% 미만은 붉게 표시돼요. 다음 강의에서 다시 짚어 줄 문항을 고를 때 쓰세요.</p>
    <div class="tbl"><table class="qa"><tr><th>번호</th><th>문항</th><th>정답률</th><th>보기별 선택 (1·2·3·4)</th></tr>
    ${b.items.map((q,i)=>{const cnt=[0,0,0,0];L.forEach(r=>{const v=+String(r.answers)[i]-1;if(v>=0&&v<4)cnt[v]++});const p=L.length?cnt[q.a]/L.length*100:0;
      return `<tr><td>${i+1}</td><td class="q">${esc(q.q)}<br><span class="miss">정답 ${q.a+1}. ${esc(q.o[q.a])}</span></td><td><div class="bar"><i class="${p<50?"low":""}" style="width:${p}%"></i></div>${L.length?p.toFixed(0)+"%":"-"}</td><td>${cnt.map((c,j)=>j===q.a?`<b>${c}</b>`:c).join(" · ")}</td></tr>`}).join("")}</table></div>`;
  }
  if(VIEW==="students"){
    const map={};ORDER.forEach(k=>latest(k).forEach(r=>{(map[r.sid]=map[r.sid]||{name:r.name})[k]=r}));
    let ids=Object.keys(map).sort().filter(s=>!Q||s.includes(Q)||map[s].name.includes(Q));
    h+=`<div class="tools"><input id="q" placeholder="학번 또는 이름 검색" value="${esc(Q)}"></div>
    <p class="note">칸의 숫자는 맞힌 문항 수이고, 빈칸은 미제출입니다. 형성평가 참여 현황 확인에 쓰세요.</p>
    <div class="tbl"><table><tr><th>학번</th><th>이름</th>${ORDER.map(k=>`<th>${WEEK[k]}</th>`).join("")}<th>참여</th></tr>
    ${ids.map(s=>{const m=map[s];const done=ORDER.filter(k=>m[k]).length;return `<tr><td>${esc(s)}</td><td>${esc(m.name)}</td>${ORDER.map(k=>`<td>${m[k]?m[k].score:'<span class="miss">·</span>'}</td>`).join("")}<td><b>${done}</b>/${ORDER.length}</td></tr>`}).join("")||`<tr><td colspan="18" class="miss">아직 제출이 없어요.</td></tr>`}</table></div>`;
  }
  app.innerHTML=h;
  app.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{VIEW=b.dataset.v;render()});
  app.querySelectorAll(".stat").forEach(b=>b.onclick=()=>{SEL=b.dataset.k;VIEW="one";render()});
  app.querySelectorAll("th[data-s]").forEach(t=>t.onclick=()=>{SORT={k:t.dataset.s,d:SORT.k===t.dataset.s?-SORT.d:1};render()});
  const s=document.getElementById("sel");if(s)s.onchange=()=>{SEL=s.value;render()};
  const q=document.getElementById("q");if(q)q.oninput=()=>{Q=q.value.trim();const pos=q.selectionStart;render();const n=document.getElementById("q");n.focus();n.setSelectionRange(pos,pos)};
  document.getElementById("reload").onclick=()=>load(sessionStorage.getItem("hp_pw"));
  document.getElementById("csv").onclick=csv;
}
function csv(){
  const head=["제출시각","평가","학번","이름","점수","만점","응답","오답문항"];
  const lines=[head.join(",")].concat(ROWS.map(r=>[r.at,WEEK[r.key]||r.key,r.sid,r.name,r.score,r.total,r.answers,r.wrong].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")));
  const blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="호스피스간호실무_평가결과.csv";a.click();toast("CSV를 내려받았어요");
}
const saved=sessionStorage.getItem("hp_pw");if(saved)load(saved);else login();
</script>
</body>
</html>
