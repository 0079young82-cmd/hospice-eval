<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>호스피스간호실무 · 진단·형성평가</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<header class="sky"><div class="wrap">
<p class="course" id="courseLbl"></p>
<h1>진단·형성평가</h1>
<p class="lead">강의를 듣고, "강의를 들었습니다"에 체크한 뒤 문제를 풀면 출석과 결과가 자동으로 교수님께 전달됩니다.</p>
</div></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="config.js?v=2"></script>
<script src="questions.js?v=2"></script>
<script>
const app=document.getElementById("app");
document.getElementById("courseLbl").textContent=COURSE_LABEL;
const UA=navigator.userAgent.slice(0,150);
const st={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let who=st.get("hp_who",null), recs=st.get("hp_recs",{}), queue=st.get("hp_queue",[]), online=null;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2000)}
function fmt(iso){const d=new Date(iso);if(isNaN(d))return "";return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`}
async function post(body){
  if(!API_URL)throw new Error("no_url");
  const r=await fetch(API_URL,{method:"POST",body:JSON.stringify(body)});
  const j=await r.json(); if(!j.ok)throw new Error(j.error||"fail"); return j;
}
// 보내지 못한 기록은 저장해 두었다가 다시 보냄
function enqueue(b){queue.push(b);st.set("hp_queue",queue)}
async function flush(){
  if(!queue.length||!API_URL)return;
  const rest=[];
  for(const b of queue){try{await post(b);if(b.action==="submit"&&recs[b.key]){recs[b.key].sent=true}}catch(e){if(e.message==="not_in_roster")continue;rest.push(b)}}
  queue=rest;st.set("hp_queue",queue);st.set("hp_recs",recs);
}
async function ping(){
  if(!API_URL){online=false;return}
  try{const r=await fetch(API_URL);const j=await r.json();online=!!j.ok}catch(e){online=false}
}
function banner(){
  if(!API_URL)return `<p class="banner">아직 제출 서버가 연결되지 않았습니다. 교수님(조교)께 알려 주세요. 문제는 풀 수 있고, 결과는 휴대폰에 저장되었다가 연결되면 자동으로 전송됩니다.</p>`;
  if(online===false)return `<p class="banner">지금 제출 서버에 연결되지 않습니다. 인터넷 연결을 확인해 주세요. 결과는 저장되었다가 연결되면 자동으로 전송됩니다.${queue.length?` (보내지 못한 기록 ${queue.length}건)`:""}</p>`;
  return queue.length?`<p class="banner">보내지 못한 기록 ${queue.length}건이 있습니다. <button class="btn" id="retry" style="margin-left:6px">다시 보내기</button></p>`:"";
}
function login(msg){
  app.innerHTML=`<section class="card">${banner()}
  <div class="who"><div><label for="sid">학번</label><input id="sid" inputmode="numeric" autocomplete="off" value="${esc(who?.sid||"")}"></div>
  <div><label for="sname">이름</label><input id="sname" autocomplete="off" value="${esc(who?.name||"")}"></div></div>
  <p class="err" id="err" style="color:var(--no)">${msg||""}</p>
  <div class="row"><button class="btn primary" id="go">들어가기</button></div>
  <p class="note">학번과 이름은 출석과 성적 확인에 쓰입니다. 정확히 입력해 주세요.</p></section>`;
  const go=async()=>{
    const sid=document.getElementById("sid").value.trim(), name=document.getElementById("sname").value.trim();
    if(!/^\d{4,12}$/.test(sid)){login("학번을 숫자로 정확히 입력해 주세요.");return}
    if(name.length<2){login("이름을 입력해 주세요.");return}
    const b={action:"login",sid,name,ua:UA,clientAt:new Date().toISOString()};
    try{await post(b)}catch(e){
      if(e.message==="not_in_roster"){login("수강생 명단에 없는 학번·이름입니다. 다시 확인하거나 조교에게 문의해 주세요.");return}
      enqueue(b);
    }
    who={sid,name};st.set("hp_who",who);home();
  };
  document.getElementById("go").onclick=go;
}
function home(){
  const item=k=>{const r=recs[k];const dl=(typeof DEADLINES!=="undefined"&&DEADLINES[k])?`<span class="pill">마감 ${fmt(DEADLINES[k])}</span>`:"";
    return `<button class="item ${k==="dx"?"dx":""}" data-k="${k}"><span class="wk">${WEEK[k]}</span><span class="t"><b>${esc(BANK[k].title)}${dl}</b><span>${BANK[k].items.length}문항</span></span>${r?`<span class="done">${r.score}/${r.total} · ${r.sent?"제출됨":"전송 대기"}</span>`:""}</button>`};
  app.innerHTML=`${banner()}<section class="card"><p style="margin:0"><b>${esc(who.name)}</b> <span class="meta">(${esc(who.sid)})</span> <button class="back" id="out" style="float:right">학번 바꾸기</button></p>
  <p class="meta" style="margin:6px 0 0">각 주차 녹화강의를 끝까지 들은 뒤 해당 평가를 풀어 주세요. 평가를 제출해야 출석으로 인정됩니다.</p></section>
  <p class="section-h">1주차</p><div class="list">${item("dx")}${item("w1")}</div>
  <p class="section-h">2~14주차 형성평가</p><div class="list">${ORDER.filter(k=>k!=="dx"&&k!=="w1").map(item).join("")}</div>`;
  app.querySelectorAll(".item").forEach(b=>b.onclick=()=>gate(b.dataset.k));
  document.getElementById("out").onclick=()=>login();
  const rt=document.getElementById("retry");if(rt)rt.onclick=async()=>{await flush();await ping();home();toast(queue.length?"아직 보내지 못했어요":"모두 보냈어요")};
}
function gate(k){
  const lect=k==="dx"||k==="w1"?"1주차 오리엔테이션":WEEK[k];
  app.innerHTML=`<section class="card"><button class="back" id="bk">← 목록으로</button>
  <h2 style="margin:8px 0 6px">${WEEK[k]} · ${esc(BANK[k].title)}</h2>
  <p class="meta">${BANK[k].items.length}문항 · 한 문항씩 풀면 바로 해설이 나옵니다.${recs[k]?` · 이미 ${recs[k].attempt||1}회 제출함(다시 풀 수 있음)`:""}</p>
  <label class="check" for="ck"><input type="checkbox" id="ck"><span><b>${lect} 강의를 들었습니다.</b><br><span class="meta">체크한 시각이 출석 기록으로 남습니다.</span></span></label>
  <div class="row"><button class="btn primary" id="st" disabled>평가 시작</button></div></section>`;
  const ck=document.getElementById("ck"),sb=document.getElementById("st");
  ck.onchange=()=>{sb.disabled=!ck.checked};
  document.getElementById("bk").onclick=home;
  sb.onclick=()=>{
    const now=new Date().toISOString();
    const b={action:"event",event:"lecture_check",sid:who.sid,name:who.name,key:k,detail:`${lect} 강의 들음 체크`,ua:UA,clientAt:now};
    post(b).catch(e=>enqueue(b));
    quiz(k,now);
  };
}
function quiz(k,checkedAt){
  const items=BANK[k].items, S={k,i:0,ans:[],t0:Date.now(),qStart:Date.now(),perQ:[],leave:0,checkedAt,startedAt:new Date().toISOString()};
  const onVis=()=>{if(document.hidden)S.leave++};document.addEventListener("visibilitychange",onVis);
  const draw=()=>{
    const q=items[S.i];
    app.innerHTML=`<section class="card"><div class="q-top"><span class="meta">${WEEK[k]} · ${S.i+1}/${items.length}</span><div class="flames">${items.map((_,j)=>`<i class="${j<S.i?"on":""}"></i>`).join("")}</div></div>
    <p class="qtext">${esc(q.q)}</p><div class="opts" style="display:flex;flex-direction:column;gap:10px">${q.o.map((o,j)=>`<button class="opt" data-j="${j}"><span class="n">${j+1}</span><span>${esc(o)}</span></button>`).join("")}</div><div id="fb"></div></section>`;
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const j=+b.dataset.j;S.ans[S.i]=j;S.perQ[S.i]=Math.round((Date.now()-S.qStart)/1000);
      app.querySelectorAll(".opt").forEach(x=>{x.disabled=true;const v=+x.dataset.j;if(v===q.a)x.classList.add("right");else if(v===j)x.classList.add("wrong")});
      document.getElementById("fb").innerHTML=`<div class="fb"><b>${j===q.a?"정답이에요.":"정답은 "+(q.a+1)+"번이에요."}</b> ${esc(q.e)}</div><div class="row"><button class="btn primary" id="nx">${S.i+1<items.length?"다음 문항":"결과 보기"}</button></div>`;
      document.getElementById("nx").onclick=()=>{S.i++;S.qStart=Date.now();if(S.i<items.length)draw();else{document.removeEventListener("visibilitychange",onVis);finish(S)}};
    });
  };
  draw();
}
async function finish(S){
  const k=S.k,items=BANK[k].items;
  const score=items.filter((q,i)=>S.ans[i]===q.a).length, wrong=items.map((q,i)=>S.ans[i]===q.a?null:i+1).filter(Boolean);
  const attempt=((recs[k]&&recs[k].attempt)||0)+1;
  const b={action:"submit",key:k,sid:who.sid,name:who.name,score,total:items.length,answers:S.ans.map(a=>a+1).join(""),wrong:wrong.join(","),
    checkedAt:S.checkedAt,startedAt:S.startedAt,clientAt:new Date().toISOString(),durationSec:Math.round((Date.now()-S.t0)/1000),
    perQ:S.perQ.join(","),leaveCount:S.leave,attempt,ua:UA,subId:Date.now().toString(36)+Math.random().toString(36).slice(2,8)};
  recs[k]={score,total:items.length,attempt,sent:false,at:b.clientAt};st.set("hp_recs",recs);
  app.innerHTML=`<section class="card"><h2>${score} / ${items.length}</h2><p class="meta">${WEEK[k]} · ${esc(BANK[k].title)}</p>
  <p id="sst" class="banner" style="background:var(--lamp-soft);color:var(--ink)">결과를 교수님께 보내는 중이에요…</p>
  <div class="row"><button class="btn" id="cp">결과 복사</button><button class="btn" id="again">다시 풀기</button><button class="btn primary" id="hm">목록으로</button></div></section>`;
  const sst=document.getElementById("sst");
  const send=async()=>{try{await post(b);recs[k].sent=true;st.set("hp_recs",recs);sst.style.background="var(--ok-bg)";sst.style.color="var(--ok)";sst.textContent="제출 완료! 출석과 결과가 교수님께 전달되었습니다."}
    catch(e){enqueue(b);sst.style.background="var(--no-bg)";sst.style.color="var(--no)";sst.innerHTML=`지금은 보내지 못했어요. 결과는 저장되어 다음에 앱을 열 때 자동으로 다시 보냅니다. <button class="btn" id="rs">지금 다시 보내기</button>`;
      document.getElementById("rs").onclick=async()=>{await flush();if(recs[k].sent){sst.style.background="var(--ok-bg)";sst.style.color="var(--ok)";sst.textContent="제출 완료! 출석과 결과가 교수님께 전달되었습니다."}else toast("아직 연결되지 않아요")}}};
  send();
  document.getElementById("hm").onclick=home;
  document.getElementById("again").onclick=()=>gate(k);
  document.getElementById("cp").onclick=()=>{const t=`[호스피스간호실무 ${WEEK[k]}] ${who.sid} ${who.name} 점수 ${score}/${items.length} 응답 ${b.answers} 제출 ${b.clientAt}`;navigator.clipboard?.writeText(t).then(()=>toast("복사했어요"),()=>prompt("복사해 주세요",t))};
}
(async()=>{await ping();await flush();if(who)home();else login();})();
</script>
</body>
</html>
